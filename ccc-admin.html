
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heet Computer CCC Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;padding:15px;margin:0}
.container{max-width:1200px;margin:20px auto;background:white;padding:20px;border-radius:10px}
input,button{padding:10px;margin:6px 0;box-sizing:border-box}
input{width:100%;border:1px solid #ccc;border-radius:5px}
button{cursor:pointer;background:#174a8b;color:white;border:0;border-radius:5px}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin-top:20px;min-width:950px}
th,td{border:1px solid #ddd;padding:9px;text-align:left}
th{background:#174a8b;color:white}
#panel,#resetPanel,#studentModal,#editModal,#uploadModal{display:none}
#studentModal,#editModal,#uploadModal{background:white;border:1px solid #ccc;border-radius:10px;padding:18px;margin:15px auto;max-width:700px}
.password-row{display:flex;gap:6px;align-items:center}
.password-row input{flex:1}
.password-row button{white-space:nowrap}
.doc{display:block;margin:4px 0;font-size:12px}
.editBtn{background:#287a3d}
.deleteBtn{background:#b3261e}
.uploadBtn{background:#7044a5}
.publishBtn{background:#168044}
.modalInput{margin:8px 0}
.modalInput label{display:block;font-weight:bold}
#message{font-weight:bold}
.feeBox{border:1px solid #ddd;padding:14px;border-radius:8px;margin:15px 0}
.feeBox input{max-width:250px}
.status{font-size:12px;font-weight:bold}
@media(max-width:600px){
 .container{padding:12px;margin:8px auto}
 body{padding:7px}
}
</style>
</head>
<body>
<div class="container">
<h2>Heet Computer - CCC Admin Panel</h2>

<div id="loginPanel">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email" autocomplete="username">
<div class="password-row">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button type="button" onclick="togglePassword()">👁</button>
</div>
<button type="button" onclick="adminLogin()">Login</button>
<button type="button" onclick="sendAdminReset()">Forgot Admin Password?</button>
</div>

<div id="resetPanel">
<h3>Set New Admin Password</h3>
<input id="newAdminPassword" type="password" placeholder="Enter New Password">
<button type="button" onclick="toggleNewPassword()">👁</button>
<button type="button" onclick="saveAdminPassword()">Save New Password</button>
</div>

<div id="panel">
<button type="button" onclick="loadStudents()">Refresh Students</button>
<button type="button" onclick="logout()">Logout</button>
<p id="message"></p>

<div class="feeBox">
<h3>Registration Fee Setting</h3>
<label>New Registration Fee (₹)</label>
<input type="number" id="registrationFee" min="1" placeholder="Enter Registration Fee">
<button type="button" onclick="saveRegistrationFee()">Save Registration Fee</button>
<p id="feeMessage"></p>
</div>

<input type="text" id="searchStudent" placeholder="Search by Name or Mobile" oninput="searchStudents()">

<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Mobile</th><th>Payment</th>
<th>Documents</th><th>Details</th><th>Action</th>
</tr>
</thead>
<tbody id="students"></tbody>
</table>
</div>
</div>

<div id="studentModal">
<h3>Student Full Details</h3>
<div id="studentDetails"></div>
<button type="button" onclick="closeDetails()">Close</button>
</div>

<div id="editModal">
<h3>Edit Student Details</h3>
<input type="hidden" id="editId">
<div class="modalInput"><label>Student Name</label><input id="editName"></div>
<div class="modalInput"><label>Mobile Number</label><input id="editMobile"></div>
<div class="modalInput"><label>Email Address</label><input id="editEmail"></div>
<div class="modalInput"><label>Admission Date</label><input id="editAdmission" type="date"></div>
<div class="modalInput"><label>Completion Date</label><input id="editCompletion" type="date"></div>
<div class="modalInput"><label>Aadhaar Last 4 Digits</label><input id="editAadhaar" maxlength="4"></div>
<div class="modalInput"><label>Registration Status</label><input id="editRegistration"></div>
<div class="modalInput"><label>Payment Amount</label><input id="editAmount" type="number"></div>
<div class="modalInput"><label>Payment Status</label><input id="editPayment"></div>
<div class="modalInput"><label>Exam Status</label><input id="editExamStatus"></div>
<div class="modalInput"><label>Exam Score</label><input id="editExamScore" type="number"></div>
<div class="modalInput"><label>Certificate Number</label><input id="editCertificate"></div>
<div class="modalInput"><label>Certificate Issue Date</label><input id="editCertificateDate" type="date"></div>
<button type="button" onclick="saveStudent()">Save Changes</button>
<button type="button" onclick="closeEdit()" style="background:#666">Cancel</button>
</div>

<div id="uploadModal">
<h3>Certificate & Marksheet PDF Upload</h3>
<p id="uploadStudentName"></p>
<input type="hidden" id="uploadStudentId">

<div class="modalInput">
<label>Certificate PDF</label>
<input type="file" id="certificateFile" accept="application/pdf,.pdf">
<button type="button" onclick="uploadPdf('certificate')">Upload Certificate PDF</button>
<p id="certificateStatus" class="status"></p>
</div>

<div class="modalInput">
<label>Marksheet PDF</label>
<input type="file" id="marksheetFile" accept="application/pdf,.pdf">
<button type="button" onclick="uploadPdf('marksheet')">Upload Marksheet PDF</button>
<p id="marksheetStatus" class="status"></p>
</div>

<p id="publishStatus"></p>
<button type="button" class="publishBtn" id="publishButton" onclick="publishDocuments()">Admin Publish</button>
<button type="button" onclick="closeUpload()" style="background:#666">Close</button>
</div>

</div>

<script>
const SUPABASE_URL = "https://rwtdwtbxuoilzecerojm.supabase.co";
const SUPABASE_KEY = "sb_publishable_5ggHaapc4cno062CdS7OGg_-6PLyF8t";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "ccc-student-documents";
const MAX_FILE_SIZE = 10 * 1024 * 1024;

let studentsData = [];
let uploadStudent = null;

function togglePassword(){
 const p=document.getElementById("password");
 p.type=p.type==="password"?"text":"password";
}
function toggleNewPassword(){
 const p=document.getElementById("newAdminPassword");
 p.type=p.type==="password"?"text":"password";
}
function showResetPanel(){
 document.getElementById("loginPanel").style.display="none";
 document.getElementById("panel").style.display="none";
 document.getElementById("resetPanel").style.display="block";
}

async function sendAdminReset(){
 const email=document.getElementById("email").value.trim();
 if(!email){alert("Admin Email દાખલ કરો.");return;}
 const {error}=await db.auth.resetPasswordForEmail(email,{
  redirectTo:"https://heetcomputer.in/ccc-admin.html"
 });
 if(error){alert("Reset Email Error: "+error.message);return;}
 alert("Password Reset Email મોકલ્યો છે. Email માં નવી link ખોલો.");
}

async function saveAdminPassword(){
 const password=document.getElementById("newAdminPassword").value;
 if(password.length<6){alert("Password ઓછામાં ઓછો 6 અક્ષરનો હોવો જોઈએ.");return;}
 const {error}=await db.auth.updateUser({password});
 if(error){alert("Password Update Error: "+error.message);return;}
 alert("Admin Password Successfully Changed.");
 await db.auth.signOut();
 window.location.replace("https://heetcomputer.in/ccc-admin.html");
}

async function adminLogin(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){alert("Admin Email અને Password દાખલ કરો.");return;}
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){alert("Login Error: "+error.message);return;}
 showAdminPanel();
}

function showAdminPanel(){
 document.getElementById("loginPanel").style.display="none";
 document.getElementById("resetPanel").style.display="none";
 document.getElementById("panel").style.display="block";
 loadRegistrationFee();
 loadStudents();
}

async function loadRegistrationFee(){
 const box=document.getElementById("feeMessage");
 const {data,error}=await db.from("ccc_settings")
  .select("setting_value")
  .eq("setting_key","registration_fee")
  .maybeSingle();
 if(error){
  box.textContent="Fee Load Error: "+error.message;
  return;
 }
 if(data){
  document.getElementById("registrationFee").value=data.setting_value;
  box.textContent="Current Fee: ₹"+data.setting_value;
 }else{
  box.textContent="Registration Fee setting record મળ્યો નથી.";
 }
}

async function saveRegistrationFee(){
 const input=document.getElementById("registrationFee");
 const fee=Number(input.value);
 const msg=document.getElementById("feeMessage");
 if(!Number.isFinite(fee)||fee<=0){
  alert("યોગ્ય Registration Fee દાખલ કરો.");
  return;
 }
 const {data,error}=await db.from("ccc_settings").upsert({
  setting_key:"registration_fee",
  setting_value:fee,
  updated_at:new Date().toISOString()
 },{onConflict:"setting_key"}).select("setting_key,setting_value").maybeSingle();

 if(error){
  msg.textContent="Fee Save Error: "+error.message;
  alert("Fee Save Error: "+error.message);
  return;
 }
 if(!data){
  msg.textContent="Fee save થયું નથી. Supabase permission તપાસો.";
  return;
 }
 msg.textContent="Registration Fee Updated: ₹"+data.setting_value;
 alert("Registration Fee Successfully Updated.");
}

function getStoragePath(value){
 if(!value)return null;
 let path=String(value);
 if(path.startsWith("http")){
  const marker="/storage/v1/object/";
  const index=path.indexOf(marker);
  if(index===-1)return null;
  path=path.substring(index+marker.length);
  path=path.replace(/^(public|sign|authenticated)\//,"");
  path=path.replace(/^ccc-student-documents\//,"");
  path=path.split("?")[0];
 }else{
  path=path.replace(/^ccc-student-documents\//,"");
 }
 try{path=decodeURIComponent(path);}catch(e){}
 return path||null;
}

async function viewDocument(value){
 const newTab=window.open("about:blank","_blank");
 if(!newTab){alert("Browser માં pop-up allow કરો.");return;}
 const path=getStoragePath(value);
 if(!path){newTab.close();alert("Document path મળ્યો નથી.");return;}
 const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,300,{download:false});
 if(error||!data?.signedUrl){
  newTab.close();
  alert("Document ખોલી શકાયું નથી: "+(error?.message||"Unknown error"));
  return;
 }
 newTab.location.href=data.signedUrl;
}

function addCell(tr,value){
 const td=document.createElement("td");
 td.textContent=value??"";
 tr.appendChild(td);
 return td;
}

async function loadStudents(){
 const message=document.getElementById("message");
 const tbody=document.getElementById("students");
 message.textContent="Loading...";
 tbody.replaceChildren();

 const {data,error}=await db.from("ccc_registrations")
  .select("id,student_name,mobile_number,email_address,admission_date,completion_date,aadhaar_last4,certificate_date_option,registration_status,payment_amount,payment_status,exam_status,exam_score,certificate_number,certificate_issue_date,student_photo_url,signature_url,marksheet_10_url,marksheet_12_url,marksheet_graduation_url,aadhaar_card_url,certificate_pdf_path,marksheet_pdf_path,documents_available_at,documents_upload_eligible")
  .order("created_at",{ascending:false});

 if(error){
  message.textContent="Load Error: "+error.message;
  return;
 }
 studentsData=data||[];

 studentsData.forEach(s=>{
  const tr=document.createElement("tr");
  addCell(tr,s.id);
  addCell(tr,s.student_name);
  addCell(tr,s.mobile_number);
  addCell(tr,"₹"+(s.payment_amount??"")+" / "+(s.payment_status??""));

  const docs=addCell(tr,"");
  const files=[
   ["Photo",s.student_photo_url],
   ["Signature",s.signature_url],
   ["10th Marksheet",s.marksheet_10_url],
   ["12th Marksheet",s.marksheet_12_url],
   ["Graduation",s.marksheet_graduation_url],
   ["Aadhaar",s.aadhaar_card_url],
   ["Certificate PDF",s.certificate_pdf_path],
   ["Marksheet PDF",s.marksheet_pdf_path]
  ];
  files.forEach(([label,path])=>{
   if(path){
    const b=document.createElement("button");
    b.className="doc";
    b.textContent="View "+label;
    b.onclick=()=>viewDocument(path);
    docs.appendChild(b);
   }
  });
  if(s.documents_available_at){
   const p=document.createElement("p");
   p.className="status";
   p.textContent="Published";
   docs.appendChild(p);
  }

  const details=addCell(tr,"");
  const detailButton=document.createElement("button");
  detailButton.textContent="View Details";
  detailButton.onclick=()=>showDetails(s);
  details.appendChild(detailButton);

  const action=addCell(tr,"");

  const paid=document.createElement("button");
  paid.textContent="Mark Paid";
  paid.disabled=String(s.payment_status||"").toLowerCase()==="paid";
  paid.onclick=()=>markPaid(s.id,paid);
  action.appendChild(paid);

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.className="editBtn";
  edit.onclick=()=>editStudent(s);
  action.appendChild(edit);

  if(s.documents_upload_eligible===true &&
     String(s.payment_status||"").toLowerCase()==="paid"){
   const upload=document.createElement("button");
   upload.textContent="PDF Upload";
   upload.className="uploadBtn";
   upload.onclick=()=>openUpload(s);
   action.appendChild(upload);
  }else{
   const p=document.createElement("p");
   p.className="status";
   p.textContent="PDF Upload Not Eligible";
   action.appendChild(p);
  }

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="deleteBtn";
  del.onclick=()=>deleteStudent(s.id,s.student_name);
  action.appendChild(del);

  tbody.appendChild(tr);
 });

 message.textContent="Total registrations: "+studentsData.length;
 searchStudents();
}

function showDetails(s){
 const fields=[
  ["Name",s.student_name],["Mobile",s.mobile_number],
  ["Email",s.email_address],["Registration ID",s.id],
  ["Registration Number",s.registration_number],
  ["Admission Date",s.admission_date],["Completion Date",s.completion_date],
  ["Aadhaar Last 4",s.aadhaar_last4],
  ["Registration Status",s.registration_status],
  ["Payment Amount","₹"+s.payment_amount],["Payment Status",s.payment_status],
  ["Exam Status",s.exam_status],["Exam Score",s.exam_score],
  ["Certificate Number",s.certificate_number],
  ["Certificate Issue Date",s.certificate_issue_date],
  ["Certificate PDF",s.certificate_pdf_path?"Uploaded":"Not Uploaded"],
  ["Marksheet PDF",s.marksheet_pdf_path?"Uploaded":"Not Uploaded"],
  ["Documents Published",s.documents_available_at?"Yes":"No"]
 ];
 const box=document.getElementById("studentDetails");
 box.replaceChildren();
 fields.forEach(([label,value])=>{
  const p=document.createElement("p");
  p.textContent=label+": "+(value??"Not Available");
  box.appendChild(p);
 });
 document.getElementById("studentModal").style.display="block";
}
function closeDetails(){
 document.getElementById("studentModal").style.display="none";
}

function editStudent(s){
 document.getElementById("editId").value=s.id;
 document.getElementById("editName").value=s.student_name||"";
 document.getElementById("editMobile").value=s.mobile_number||"";
 document.getElementById("editEmail").value=s.email_address||"";
 document.getElementById("editAdmission").value=s.admission_date||"";
 document.getElementById("editCompletion").value=s.completion_date||"";
 document.getElementById("editAadhaar").value=s.aadhaar_last4||"";
 document.getElementById("editRegistration").value=s.registration_status||"";
 document.getElementById("editAmount").value=s.payment_amount??"";
 document.getElementById("editPayment").value=s.payment_status||"";
 document.getElementById("editExamStatus").value=s.exam_status||"";
 document.getElementById("editExamScore").value=s.exam_score??"";
 document.getElementById("editCertificate").value=s.certificate_number||"";
 document.getElementById("editCertificateDate").value=s.certificate_issue_date||"";
 document.getElementById("editModal").style.display="block";
}
function closeEdit(){
 document.getElementById("editModal").style.display="none";
}

async function saveStudent(){
 const id=document.getElementById("editId").value;
 const amount=document.getElementById("editAmount").value;
 const score=document.getElementById("editExamScore").value;
 const updates={
  student_name:document.getElementById("editName").value.trim(),
  mobile_number:document.getElementById("editMobile").value.trim(),
  email_address:document.getElementById("editEmail").value.trim()||null,
  admission_date:document.getElementById("editAdmission").value||null,
  completion_date:document.getElementById("editCompletion").value||null,
  aadhaar_last4:document.getElementById("editAadhaar").value.trim()||null,
  registration_status:document.getElementById("editRegistration").value.trim()||null,
  payment_amount:amount===""?null:Number(amount),
  payment_status:document.getElementById("editPayment").value.trim()||null,
  exam_status:document.getElementById("editExamStatus").value.trim()||null,
  exam_score:score===""?null:Number(score),
  certificate_number:document.getElementById("editCertificate").value.trim()||null,
  certificate_issue_date:document.getElementById("editCertificateDate").value||null
 };
 if(!updates.student_name||!updates.mobile_number){
  alert("Student Name અને Mobile Number જરૂરી છે.");return;
 }
 if(updates.aadhaar_last4&&!/^\d{4}$/.test(updates.aadhaar_last4)){
  alert("Aadhaar ના છેલ્લાં 4 અંક જ લખો.");return;
 }
 const {error}=await db.from("ccc_registrations").update(updates).eq("id",id);
 if(error){alert("Update Error: "+error.message);return;}
 alert("Student Details Updated Successfully.");
 closeEdit();
 await loadStudents();
}

function openUpload(s){
 if(s.documents_upload_eligible!==true ||
    String(s.payment_status||"").toLowerCase()!=="paid"){
  alert("આ વિદ્યાર્થી PDF Upload માટે Eligible નથી અથવા Payment Paid નથી.");
  return;
 }
 uploadStudent=s;
 document.getElementById("uploadStudentId").value=s.id;
 document.getElementById("uploadStudentName").textContent=
  "Student: "+s.student_name+" | ID: "+s.id;
 document.getElementById("certificateFile").value="";
 document.getElementById("marksheetFile").value="";
 document.getElementById("certificateStatus").textContent=
  s.certificate_pdf_path?"Certificate PDF Uploaded":"Certificate PDF Not Uploaded";
 document.getElementById("marksheetStatus").textContent=
  s.marksheet_pdf_path?"Marksheet PDF Uploaded":"Marksheet PDF Not Uploaded";
 document.getElementById("publishStatus").textContent=
  s.documents_available_at?"Already Published":"Not Published";
 document.getElementById("publishButton").disabled=
  !(s.certificate_pdf_path&&s.marksheet_pdf_path)||!!s.documents_available_at;
 document.getElementById("uploadModal").style.display="block";
}
function closeUpload(){
 document.getElementById("uploadModal").style.display="none";
 uploadStudent=null;
}

async function uploadPdf(type){
 if(!uploadStudent)return;
 if(uploadStudent.documents_upload_eligible!==true ||
    String(uploadStudent.payment_status||"").toLowerCase()!=="paid"){
  alert("આ વિદ્યાર્થી PDF Upload માટે Eligible નથી.");
  return;
 }

 const isCertificate=type==="certificate";
 const input=document.getElementById(isCertificate?"certificateFile":"marksheetFile");
 const status=document.getElementById(isCertificate?"certificateStatus":"marksheetStatus");
 const file=input.files[0];

 if(!file){alert("પહેલાં PDF File પસંદ કરો.");return;}
 if(!file.name.toLowerCase().endsWith(".pdf") ||
    (file.type && file.type!=="application/pdf")){
  alert("માત્ર PDF File જ Upload કરી શકાય છે.");return;
 }
 if(file.size>MAX_FILE_SIZE){
  alert("PDF File 10 MB કરતાં નાની હોવી જોઈએ.");return;
 }

 status.textContent="Uploading...";
 const field=isCertificate?"certificate_pdf_path":"marksheet_pdf_path";
 const fileType=isCertificate?"certificate":"marksheet";
 const safeName=fileType+"-"+Date.now()+".pdf";
 const path="admin-documents/"+uploadStudent.id+"/"+safeName;

 const {error:uploadError}=await db.storage.from(BUCKET).upload(path,file,{
  contentType:"application/pdf",
  upsert:false
 });
 if(uploadError){
  status.textContent="Upload Failed";
  alert("PDF Upload Error: "+uploadError.message);
  return;
 }

 const {error:updateError}=await db.from("ccc_registrations")
  .update({[field]:path})
  .eq("id",uploadStudent.id)
  .eq("documents_upload_eligible",true);

 if(updateError){
  await db.storage.from(BUCKET).remove([path]);
  status.textContent="Database Update Failed";
  alert("Database Update Error: "+updateError.message);
  return;
 }

 uploadStudent[field]=path;
 status.textContent="PDF Successfully Uploaded";
 alert((isCertificate?"Certificate":"Marksheet")+" PDF Successfully Uploaded.");

 const bothUploaded=!!uploadStudent.certificate_pdf_path &&
                    !!uploadStudent.marksheet_pdf_path;
 document.getElementById("publishButton").disabled=
  !bothUploaded||!!uploadStudent.documents_available_at;

 await loadStudents();
}

async function publishDocuments(){
 if(!uploadStudent)return;
 if(!uploadStudent.certificate_pdf_path||!uploadStudent.marksheet_pdf_path){
  alert("Certificate અને Marksheet બંને PDF પહેલાં Upload કરો.");
  return;
 }
 if(uploadStudent.documents_upload_eligible!==true ||
    String(uploadStudent.payment_status||"").toLowerCase()!=="paid"){
  alert("આ વિદ્યાર્થી Publish માટે Eligible નથી.");
  return;
 }
 if(!confirm("શું તમે બંને PDF Student Verification માટે Publish કરવા માંગો છો?")){
  return;
 }

 const publishTime=new Date().toISOString();
 const {data,error}=await db.from("ccc_registrations")
  .update({documents_available_at:publishTime})
  .eq("id",uploadStudent.id)
  .eq("documents_upload_eligible",true)
  .select("id,documents_available_at")
  .maybeSingle();

 if(error){alert("Publish Error: "+error.message);return;}
 if(!data){
  alert("Publish થયું નથી. Supabase permission અથવા Eligibility તપાસો.");
  return;
 }

 uploadStudent.documents_available_at=data.documents_available_at;
 document.getElementById("publishStatus").textContent="Published Successfully";
 document.getElementById("publishButton").disabled=true;
 alert("Certificate અને Marksheet Successfully Published.");
 await loadStudents();
}

async function deleteStudent(id,name){
 const confirmed=confirm("શું તમે "+name+" નો Registration Record કાયમી Delete કરવા માંગો છો?\n\nઆ કાર્યવાહી પાછી ફેરવી શકાશે નહીં.");
 if(!confirmed)return;
 const {data,error}=await db.from("ccc_registrations").delete().eq("id",id).select("id");
 if(error){alert("Delete Error: "+error.message);return;}
 if(!data||data.length===0){
  alert("Record Delete થયો નથી. Supabase માં DELETE permission તપાસવી પડશે.");
  return;
 }
 alert("Student Registration Record Deleted.");
 await loadStudents();
}

async function markPaid(id,button){
 if(!confirm("Test માટે Payment Paid કરવું છે?"))return;
 button.disabled=true;
 const {data,error}=await db.from("ccc_registrations")
  .update({payment_status:"paid",registration_status:"approved"})

function searchStudents(){
 const search=(document.getElementById("searchStudent")?.value||"").toLowerCase();
 document.querySelectorAll("#students tr").forEach(row=>{
  row.style.display=row.textContent.toLowerCase().includes(search)?"":"none";
 });
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("panel").style.display="none";
 document.getElementById("resetPanel").style.display="none";
 document.getElementById("loginPanel").style.display="block";
}

function showRecoveryPanel(){
 showResetPanel();
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY")showRecoveryPanel();
});

db.auth.getSession().then(({data,error})=>{
 if(error){
  document.getElementById("message").textContent=error.message;
  return;
 }
 if(window.location.hash.includes("type=recovery")){
  showResetPanel();
  return;
 }
 if(data.session)showAdminPanel();
});
